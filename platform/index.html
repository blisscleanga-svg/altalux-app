<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Platform Admin — AltaLux App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#104872; --orange:#FF8C00; --gold:#FFAA00; --dark:#0a1628;
    --white:#fff; --ink-muted:rgba(255,255,255,.62); --ink-faint:rgba(255,255,255,.38);
    --line:rgba(255,170,0,.16); --danger:#ff6767; --green:#22c55e;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--dark); color:var(--white); font-family:'Inter',Arial,sans-serif;
    font-size:14.5px; line-height:1.5;
  }
  h1,h2,h3{ font-family:'Rajdhani',sans-serif; font-weight:700; margin:0; }
  a{ color:var(--orange); }
  button{ font-family:inherit; cursor:pointer; }

  /* ---------- Login ---------- */
  #login-screen{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .login-card{ max-width:380px; width:100%; background:#0f2138; border:1px solid var(--line); border-radius:16px; padding:32px 28px; }
  .login-card h1{ font-size:24px; text-align:center; margin-bottom:4px; }
  .login-card .sub{ text-align:center; color:var(--ink-muted); font-size:13px; margin-bottom:24px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12px; color:var(--ink-muted); margin-bottom:6px; font-weight:600; }
  .field input{ width:100%; padding:11px 13px; border-radius:8px; border:1.5px solid var(--line); background:var(--dark); color:#fff; font-size:14px; }
  .field input:focus{ outline:none; border-color:var(--orange); }
  .btn{ padding:11px 20px; border:none; border-radius:8px; background:var(--orange); color:#1a1a1a; font-family:'Rajdhani',sans-serif; font-weight:700; font-size:14.5px; }
  .btn-block{ width:100%; }
  .btn-ghost{ background:transparent; border:1px solid var(--line); color:var(--white); }
  .btn-mini{ padding:6px 12px; font-size:12.5px; border-radius:6px; }
  .error-text{ color:var(--danger); font-size:13px; margin-top:10px; display:none; }

  /* ---------- Shell ---------- */
  #app-shell{ display:none; min-height:100vh; }
  #app-shell.visible{ display:flex; }
  .sidebar{ width:220px; flex-shrink:0; background:#0f2138; border-right:1px solid var(--line); padding:24px 16px; }
  .sidebar h1{ font-size:19px; padding:0 8px 24px; }
  .sidebar h1 .lux{ color:var(--orange); }
  .nav-item{ display:block; width:100%; text-align:left; padding:11px 12px; border:none; background:transparent; color:var(--ink-muted); border-radius:8px; font-size:14px; font-weight:600; margin-bottom:4px; }
  .nav-item.active{ background:rgba(255,140,0,.12); color:var(--orange); }
  .main{ flex:1; padding:32px 36px; max-width:1100px; }
  .view{ display:none; }
  .view.active{ display:block; }
  .view-title{ font-size:24px; margin-bottom:24px; }

  /* ---------- Dashboard ---------- */
  .stat-row{ display:flex; gap:16px; flex-wrap:wrap; margin-bottom:32px; }
  .stat-card{ background:#0f2138; border:1px solid var(--line); border-radius:12px; padding:18px 20px; min-width:140px; flex:1; }
  .stat-card .n{ font-family:'Rajdhani',sans-serif; font-weight:700; font-size:28px; }
  .stat-card .l{ color:var(--ink-muted); font-size:12px; text-transform:uppercase; letter-spacing:.05em; margin-top:4px; }
  .recent-list{ background:#0f2138; border:1px solid var(--line); border-radius:12px; padding:8px 20px; }
  .recent-row{ display:flex; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--line); font-size:13.5px; }
  .recent-row:last-child{ border-bottom:none; }

  /* ---------- Tenants table ---------- */
  .filters-bar{ display:flex; gap:10px; margin-bottom:16px; }
  .filters-bar select, .filters-bar input{ padding:9px 12px; border-radius:8px; border:1.5px solid var(--line); background:#0f2138; color:#fff; font-size:13px; }
  table{ width:100%; border-collapse:collapse; background:#0f2138; border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  th, td{ padding:11px 14px; text-align:left; font-size:13px; border-bottom:1px solid var(--line); }
  th{ color:var(--ink-muted); font-size:11px; text-transform:uppercase; letter-spacing:.04em; }
  tr:last-child td{ border-bottom:none; }
  .badge{ display:inline-block; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:700; text-transform:uppercase; }
  .badge-pending{ background:rgba(255,170,0,.15); color:var(--gold); }
  .badge-approved{ background:rgba(34,197,94,.15); color:var(--green); }
  .badge-suspended{ background:rgba(255,103,103,.15); color:var(--danger); }
  .badge-rejected{ background:rgba(255,255,255,.08); color:var(--ink-muted); }
  .row-actions{ display:flex; gap:6px; flex-wrap:wrap; }
  .empty-state{ text-align:center; color:var(--ink-faint); padding:30px; }

  /* ---------- Templates ---------- */
  .template-table td input{ width:90px; padding:6px 8px; border-radius:6px; border:1px solid var(--line); background:var(--dark); color:#fff; font-size:13px; }

  /* ---------- Modal ---------- */
  .modal-overlay{ position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; padding:20px; z-index:100; }
  .modal-overlay[hidden]{ display:none; }
  .modal-box{ background:#0f2138; border:1px solid var(--line); border-radius:14px; padding:26px; max-width:480px; width:100%; max-height:85vh; overflow-y:auto; }
  .modal-box h2{ font-size:19px; margin-bottom:16px; }
  .modal-close{ float:right; background:none; border:none; color:var(--ink-muted); font-size:18px; }
  .detail-row{ display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--line); font-size:13px; }
  .detail-row:last-child{ border-bottom:none; }
  .toast-container{ position:fixed; bottom:20px; right:20px; z-index:200; display:flex; flex-direction:column; gap:8px; }
  .toast{ background:#0f2138; border:1px solid var(--line); border-left:4px solid var(--orange); border-radius:8px; padding:12px 18px; font-size:13.5px; }
  .toast-error{ border-left-color:var(--danger); }
  .toast-success{ border-left-color:var(--green); }
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="login-screen">
  <div class="login-card">
    <h1>ALTA<span style="color:var(--orange);">LUX</span> APP</h1>
    <p class="sub">Platform Admin</p>
    <div class="field"><label for="login-email">Email</label><input type="email" id="login-email"></div>
    <div class="field"><label for="login-password">Password</label><input type="password" id="login-password"></div>
    <button type="button" class="btn btn-block" id="login-submit">Log In</button>
    <p class="error-text" id="login-error"></p>
  </div>
</div>

<!-- ================= SHELL ================= -->
<div id="app-shell">
  <div class="sidebar">
    <h1>ALTA<span class="lux" style="color:var(--orange);">LUX</span></h1>
    <button type="button" class="nav-item active" data-view="dashboard">Dashboard</button>
    <button type="button" class="nav-item" data-view="tenants">Tenants</button>
    <button type="button" class="nav-item" data-view="templates">Templates</button>
    <button type="button" class="nav-item" id="logout-btn" style="margin-top:24px; color:var(--danger);">Log Out</button>
  </div>

  <div class="main">
    <!-- DASHBOARD -->
    <div class="view active" id="view-dashboard">
      <h2 class="view-title">Dashboard</h2>
      <div class="stat-row" id="stat-cards"></div>
      <h3 style="margin-bottom:12px; font-size:15px; color:var(--ink-muted);">Recent Signups</h3>
      <div class="recent-list" id="recent-signups"></div>
    </div>

    <!-- TENANTS -->
    <div class="view" id="view-tenants">
      <h2 class="view-title">Tenants</h2>
      <div class="filters-bar">
        <select id="tenant-status-filter">
          <option value="">All statuses</option>
          <option value="pending">Pending</option>
          <option value="approved">Approved</option>
          <option value="suspended">Suspended</option>
          <option value="rejected">Rejected</option>
        </select>
        <input type="text" id="tenant-search" placeholder="Search by business name...">
      </div>
      <table>
        <thead><tr><th>Business</th><th>Slug</th><th>Owner Email</th><th>City/State</th><th>Status</th><th>Signed Up</th><th>Actions</th></tr></thead>
        <tbody id="tenants-tbody"></tbody>
      </table>
    </div>

    <!-- TEMPLATES -->
    <div class="view" id="view-templates">
      <h2 class="view-title">Templates</h2>
      <h3 style="margin-bottom:10px; font-size:14px; color:var(--ink-muted);">Services</h3>
      <table class="template-table" style="margin-bottom:28px;">
        <thead><tr><th>Category</th><th>Package</th><th>Vehicle Type</th><th>Price</th><th></th></tr></thead>
        <tbody id="service-templates-tbody"></tbody>
      </table>
      <h3 style="margin-bottom:10px; font-size:14px; color:var(--ink-muted);">Add-ons</h3>
      <table class="template-table">
        <thead><tr><th>Name</th><th>Category</th><th>Price</th><th></th></tr></thead>
        <tbody id="addon-templates-tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- ================= TENANT DETAILS MODAL ================= -->
<div class="modal-overlay" id="details-modal" hidden>
  <div class="modal-box">
    <button type="button" class="modal-close" id="details-close">✕</button>
    <h2 id="details-title">Tenant Details</h2>
    <div id="details-body"></div>
  </div>
</div>

<!-- ================= REJECT REASON MODAL ================= -->
<div class="modal-overlay" id="reject-modal" hidden>
  <div class="modal-box" style="max-width:400px;">
    <button type="button" class="modal-close" id="reject-close">✕</button>
    <h2>Reject Application</h2>
    <div class="field" style="margin-top:14px;">
      <label for="reject-reason">Reason (optional, included in the email)</label>
      <input type="text" id="reject-reason">
    </div>
    <button type="button" class="btn btn-block" id="reject-confirm" style="margin-top:14px; background:var(--danger); color:#fff;">Confirm Rejection</button>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  "use strict";

  var SUPABASE_URL = 'https://xmhsehfdmiqbwhpqjgon.supabase.co';
  var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhtaHNlaGZkbWlxYndocHFqZ29uIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMzODU5NzQsImV4cCI6MjA5ODk2MTk3NH0.J2UOp-pgzP6ByvDBoHcocFAmarWdlDK8M31YgKrUNss';
  var MANAGE_TENANT_URL = SUPABASE_URL + '/functions/v1/manage-tenant';
  var SUPER_ADMIN_EMAIL = 'blisscleanmobilega@gmail.com'; // cosmético — el enforcement real vive en manage-tenant

  var db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function showToast(message, type){
    var el = document.createElement('div');
    el.className = 'toast' + (type ? ' toast-' + type : '');
    el.textContent = message;
    document.getElementById('toast-container').appendChild(el);
    setTimeout(function(){ el.remove(); }, 4000);
  }

  async function callManageTenant(action, extra){
    var session = (await db.auth.getSession()).data.session;
    if (!session) throw new Error('Not signed in.');
    var res = await fetch(MANAGE_TENANT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + session.access_token, apikey: SUPABASE_ANON_KEY },
      body: JSON.stringify(Object.assign({ action: action }, extra))
    });
    var data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Request failed.');
    return data;
  }

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function fmtDate(iso){ return iso ? new Date(iso).toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' }) : '—'; }

  // ================= LOGIN =================
  document.getElementById('login-submit').addEventListener('click', async function(){
    var email = document.getElementById('login-email').value.trim();
    var password = document.getElementById('login-password').value;
    var errorEl = document.getElementById('login-error');
    errorEl.style.display = 'none';
    var btn = document.getElementById('login-submit');
    btn.disabled = true; btn.textContent = 'Logging in...';
    try {
      var { error } = await db.auth.signInWithPassword({ email: email, password: password });
      if (error) throw error;
      await enterApp();
    } catch (err){
      errorEl.textContent = err.message || 'Login failed.';
      errorEl.style.display = 'block';
    } finally {
      btn.disabled = false; btn.textContent = 'Log In';
    }
  });

  document.getElementById('logout-btn').addEventListener('click', async function(){
    await db.auth.signOut();
    document.getElementById('app-shell').classList.remove('visible');
    document.getElementById('login-screen').style.display = 'flex';
  });

  async function enterApp(){
    var session = (await db.auth.getSession()).data.session;
    if (!session){ return; }
    // Chequeo cosmético — solo para no mostrarle el panel a alguien que
    // claramente no es el Super Admin. manage-tenant rechaza con 403 en
    // el servidor sin importar lo que haga el frontend acá.
    if ((session.user.email || '').toLowerCase() !== SUPER_ADMIN_EMAIL.toLowerCase()){
      document.getElementById('login-error').textContent = 'This account is not authorized for platform admin.';
      document.getElementById('login-error').style.display = 'block';
      await db.auth.signOut();
      return;
    }
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app-shell').classList.add('visible');
    await Promise.all([loadDashboard(), loadTenants(), loadTemplates()]);
  }

  // ================= NAV =================
  document.querySelectorAll('.nav-item[data-view]').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('.nav-item[data-view]').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      document.querySelectorAll('.view').forEach(function(v){ v.classList.remove('active'); });
      document.getElementById('view-' + btn.dataset.view).classList.add('active');
    });
  });

  // ================= DASHBOARD =================
  async function loadDashboard(){
    try {
      var data = await callManageTenant('stats', {});
      var cards = [
        { label: 'Total', n: data.counts.total },
        { label: 'Pending', n: data.counts.pending },
        { label: 'Approved', n: data.counts.approved },
        { label: 'Suspended', n: data.counts.suspended }
      ];
      document.getElementById('stat-cards').innerHTML = cards.map(function(c){
        return '<div class="stat-card"><div class="n">' + c.n + '</div><div class="l">' + c.label + '</div></div>';
      }).join('');
      document.getElementById('recent-signups').innerHTML = data.recent.length
        ? data.recent.map(function(r){
            return '<div class="recent-row"><span>' + esc(r.name) + '</span><span style="color:var(--ink-muted);">' + fmtDate(r.createdAt) + ' · ' + esc(r.status) + '</span></div>';
          }).join('')
        : '<p class="empty-state">No signups yet.</p>';
    } catch (err){
      console.error('loadDashboard failed:', err);
      showToast('Could not load dashboard: ' + err.message, 'error');
    }
  }

  // ================= TENANTS =================
  var TENANTS_CACHE = [];

  async function loadTenants(){
    try {
      var statusFilter = document.getElementById('tenant-status-filter').value;
      var data = await callManageTenant('list_tenants', statusFilter ? { status: statusFilter } : {});
      TENANTS_CACHE = data.tenants || [];
      renderTenantsTable();
    } catch (err){
      console.error('loadTenants failed:', err);
      showToast('Could not load tenants: ' + err.message, 'error');
    }
  }

  function renderTenantsTable(){
    var search = document.getElementById('tenant-search').value.trim().toLowerCase();
    var filtered = TENANTS_CACHE.filter(function(t){ return !search || (t.name || '').toLowerCase().indexOf(search) !== -1; });
    var tbody = document.getElementById('tenants-tbody');
    if (!filtered.length){
      tbody.innerHTML = '<tr><td colspan="7"><p class="empty-state">No tenants match.</p></td></tr>';
      return;
    }
    tbody.innerHTML = filtered.map(function(t){
      var cityState = [t.city, t.state].filter(Boolean).join(', ') || '—';
      var actions = [];
      if (t.status === 'pending'){
        actions.push('<button type="button" class="btn btn-mini" data-action="approve" data-id="' + esc(t.business_id) + '">Approve</button>');
        actions.push('<button type="button" class="btn btn-mini btn-ghost" data-action="reject" data-id="' + esc(t.business_id) + '">Reject</button>');
      }
      if (t.status === 'approved'){
        actions.push('<button type="button" class="btn btn-mini btn-ghost" data-action="suspend" data-id="' + esc(t.business_id) + '">Suspend</button>');
      }
      if (t.status === 'suspended'){
        actions.push('<button type="button" class="btn btn-mini" data-action="reactivate" data-id="' + esc(t.business_id) + '">Reactivate</button>');
      }
      actions.push('<button type="button" class="btn btn-mini btn-ghost" data-action="details" data-id="' + esc(t.business_id) + '">View</button>');
      return '<tr>' +
        '<td>' + esc(t.name) + '</td>' +
        '<td>' + esc(t.slug) + '</td>' +
        '<td>' + esc(t.owner_email) + '</td>' +
        '<td>' + esc(cityState) + '</td>' +
        '<td><span class="badge badge-' + esc(t.status) + '">' + esc(t.status) + '</span></td>' +
        '<td>' + fmtDate(t.created_at) + '</td>' +
        '<td><div class="row-actions">' + actions.join('') + '</div></td>' +
      '</tr>';
    }).join('');
  }

  document.getElementById('tenant-status-filter').addEventListener('change', loadTenants);
  document.getElementById('tenant-search').addEventListener('input', renderTenantsTable);

  var rejectTargetId = null;

  document.getElementById('tenants-tbody').addEventListener('click', async function(e){
    var btn = e.target.closest('button[data-action]');
    if (!btn) return;
    var action = btn.dataset.action;
    var businessId = btn.dataset.id;

    if (action === 'details'){
      openDetailsModal(businessId);
      return;
    }
    if (action === 'reject'){
      rejectTargetId = businessId;
      document.getElementById('reject-reason').value = '';
      document.getElementById('reject-modal').hidden = false;
      return;
    }
    if (action === 'approve' && !confirm('Approve this tenant? This creates their Owner login and copies the starter catalog.')) return;
    if (action === 'suspend' && !confirm('Suspend this tenant? Their admin/booking will show as inactive.')) return;
    if (action === 'reactivate' && !confirm('Reactivate this tenant?')) return;

    var actionMap = { approve: 'approve_tenant', suspend: 'suspend_tenant', reactivate: 'reactivate_tenant' };
    try {
      await callManageTenant(actionMap[action], { businessId: businessId });
      showToast('Done.', 'success');
      await Promise.all([loadDashboard(), loadTenants()]);
    } catch (err){
      console.error(action + ' failed:', err);
      showToast('Failed: ' + err.message, 'error');
    }
  });

  document.getElementById('reject-close').addEventListener('click', function(){ document.getElementById('reject-modal').hidden = true; });
  document.getElementById('reject-confirm').addEventListener('click', async function(){
    if (!rejectTargetId) return;
    try {
      await callManageTenant('reject_tenant', { businessId: rejectTargetId, reason: document.getElementById('reject-reason').value.trim() || null });
      document.getElementById('reject-modal').hidden = true;
      showToast('Application rejected.', 'success');
      await Promise.all([loadDashboard(), loadTenants()]);
    } catch (err){
      showToast('Failed: ' + err.message, 'error');
    }
  });

  async function openDetailsModal(businessId){
    var modal = document.getElementById('details-modal');
    var body = document.getElementById('details-body');
    body.innerHTML = '<p class="empty-state">Loading…</p>';
    modal.hidden = false;
    try {
      var data = await callManageTenant('tenant_details', { businessId: businessId });
      var t = data.tenant;
      document.getElementById('details-title').textContent = t.name;
      var rows = [
        ['Slug', t.slug], ['Status', t.status], ['Owner Email', t.owner_email],
        ['Phone', t.phone || '—'], ['Address', [t.address, t.city, t.state, t.zip].filter(Boolean).join(', ') || '—'],
        ['Website', t.website || '—'], ['Notification Email', t.notification_email || '—'],
        ['Onboarding Step', t.onboarding_step], ['Setup Complete', t.setup_complete ? 'Yes' : 'No'],
        ['Signed Up', fmtDate(t.created_at)], ['Approved', t.approved_at ? fmtDate(t.approved_at) + ' by ' + esc(t.approved_by) : '—'],
        ['Square Enabled', t.square_enabled ? 'Yes' : 'No']
      ];
      body.innerHTML = rows.map(function(r){ return '<div class="detail-row"><span style="color:var(--ink-muted);">' + esc(r[0]) + '</span><span>' + esc(r[1]) + '</span></div>'; }).join('');
    } catch (err){
      body.innerHTML = '<p class="empty-state">Failed to load: ' + esc(err.message) + '</p>';
    }
  }
  document.getElementById('details-close').addEventListener('click', function(){ document.getElementById('details-modal').hidden = true; });
  document.getElementById('details-modal').addEventListener('click', function(e){ if (e.target === document.getElementById('details-modal')) document.getElementById('details-modal').hidden = true; });

  // ================= TEMPLATES =================
  async function loadTemplates(){
    try {
      var data = await callManageTenant('list_templates', {});
      document.getElementById('service-templates-tbody').innerHTML = (data.services || []).map(function(s){
        return '<tr><td>' + esc(s.category) + '</td><td>' + esc(s.package || '—') + '</td><td>' + esc(s.vehicle_type) + '</td>' +
          '<td><input type="number" step="0.01" value="' + s.suggested_price + '" data-table="service_templates" data-id="' + s.id + '"></td>' +
          '<td><button type="button" class="btn btn-mini save-template-btn" data-table="service_templates" data-id="' + s.id + '">Save</button></td></tr>';
      }).join('') || '<tr><td colspan="5"><p class="empty-state">No service templates.</p></td></tr>';

      document.getElementById('addon-templates-tbody').innerHTML = (data.addons || []).map(function(a){
        return '<tr><td>' + esc(a.name) + '</td><td>' + esc(a.category || '—') + '</td>' +
          '<td><input type="number" step="0.01" value="' + a.suggested_price + '" data-table="addon_templates" data-id="' + a.id + '"></td>' +
          '<td><button type="button" class="btn btn-mini save-template-btn" data-table="addon_templates" data-id="' + a.id + '">Save</button></td></tr>';
      }).join('') || '<tr><td colspan="4"><p class="empty-state">No addon templates.</p></td></tr>';
    } catch (err){
      console.error('loadTemplates failed:', err);
      showToast('Could not load templates: ' + err.message, 'error');
    }
  }

  document.querySelectorAll('.view#view-templates').forEach(function(v){
    v.addEventListener('click', async function(e){
      var btn = e.target.closest('.save-template-btn');
      if (!btn) return;
      var table = btn.dataset.table;
      var id = btn.dataset.id;
      var input = document.querySelector('input[data-table="' + table + '"][data-id="' + id + '"]');
      var price = parseFloat(input.value);
      if (!Number.isFinite(price) || price < 0){ showToast('Invalid price.', 'error'); return; }
      try {
        await callManageTenant('update_template', { table: table, id: id, fields: { suggested_price: price } });
        showToast('Saved.', 'success');
      } catch (err){
        showToast('Failed: ' + err.message, 'error');
      }
    });
  });

  // ================= INIT =================
  (async function init(){
    var session = (await db.auth.getSession()).data.session;
    if (session) await enterApp();
  })();
})();
</script>
</body>
</html>
